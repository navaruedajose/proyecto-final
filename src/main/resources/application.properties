# =====================================================================
# Configuración del Sistema de Tickets (backend Spring Boot)
# =====================================================================

spring.application.name=sistema-tickets-spring

# Puerto del servidor. Se usa 4000 para coincidir con el backend original
# en Node.js; así el frontend no necesita cambiar su proxy de desarrollo.
server.port=4000

# ---------------------------------------------------------------------
# Base de datos PostgreSQL
# ---------------------------------------------------------------------
# Todas las claves están comentadas a propósito: mientras no se active la
# dependencia spring-boot-starter-data-jpa en el pom.xml, declarar un
# datasource haría fallar el arranque por falta del driver.
#
# Al implementar la persistencia, descomentar el bloque y escribir los
# valores reales. Las credenciales NUNCA deben quedar en este archivo: se
# pasan por variables de entorno.
#
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tickets_db}
# spring.datasource.username=${DB_USER:tickets_user}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
#
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.open-in-view=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Límites de subida de evidencias
# ---------------------------------------------------------------------
# Deben coincidir con las constantes de AdjuntoServicio. Si el límite de
# Spring fuera menor, la petición se rechazaría antes de llegar al servicio
# y el usuario recibiría un error genérico en lugar del mensaje útil.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---------------------------------------------------------------------
# JWT (pendiente)
# ---------------------------------------------------------------------
# La clave de firma debe venir de una variable de entorno y tener al menos
# 256 bits. Una clave escrita aquí y subida a un repositorio público
# permitiría a cualquiera emitir tokens validos.
#
# seguridad.jwt.clave=${JWT_CLAVE}
# seguridad.jwt.expiración-acceso=900000
# seguridad.jwt.expiración-refresco=604800000

# ---------------------------------------------------------------------
# Manejo de errores
# ---------------------------------------------------------------------
# Se oculta el mensaje interno de las excepciones no controladas. El
# manejador global ya devuelve un texto neutro, pero esta propiedad evita
# además que Spring lo incluya por su cuenta.
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------
# Registro
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.co.edu.sistematickets=DEBUG
